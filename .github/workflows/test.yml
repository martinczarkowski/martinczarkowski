name: Tests

# Pull requests run without secrets and with a read-only token; nothing is cached or pushed.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install Pillow (hash-pinned)
        run: |
          python -m pip install --require-hashes --only-binary :all: --no-deps -r requirements.txt

      - name: Portrait matches its inputs
        run: python portrait.py --check

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Render offline (layout check)
        run: python today.py --offline
